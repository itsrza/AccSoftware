# مسیر بیلد جدا از کش CI
#
# زمینه: کش قدیمی `Linux-cargo-core` (قبل از فاز تقویم) با restore-keys
# هر بار برگردانده می‌شود و artifacts کهنه‌اش مرحله‌ی Clippy را می‌شکند؛
# همزمان نمونه‌ی همان دستور روی محیط تمیز سبز است. حذف کش با توکن
# این برنامه مجاز نیست و ویرایش workflow هم بسته است؛ پس مسیر target
# را تغییر می‌دهیم تا بیلد همیشه از صفر و تمیز انجام شود. بعد از
# سبزشدن پایدار می‌توان این فایل را حذف کرد.
[build]
target-dir = "target-ci"
