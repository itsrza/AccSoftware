name: Windows Build Validation

on:
  push:
    branches: ["main", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop-ui
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop-ui
        run: npm run build

      - name: Setup Tauri CLI
        run: npm install --global @tauri-apps/cli@2.11.4

      - name: Cargo check
        working-directory: apps/desktop-host/src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: apps/desktop-host/src-tauri
        run: cargo test --locked

      - name: Tauri build
        working-directory: apps/desktop-host/src-tauri
        run: tauri build

      - name: Upload Windows installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: novin-accounting-windows-${{ github.sha }}
          path: |
            apps/desktop-host/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop-host/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
