name: Windows Build Validation

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Strict Windows QA Loop ${{ matrix.loop }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        loop: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop-ui
        run: npm ci

      - name: Frontend build
        working-directory: apps/desktop-ui
        run: npm run build

      - name: Frontend type check
        working-directory: apps/desktop-ui
        run: npx tsc --noEmit

      - name: Rust format check
        working-directory: apps/desktop-host/src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo check
        working-directory: apps/desktop-host/src-tauri
        run: cargo check --locked

      - name: Cargo test
        working-directory: apps/desktop-host/src-tauri
        run: cargo test --locked --all-targets

      - name: Cargo clippy
        working-directory: apps/desktop-host/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tauri build
        working-directory: apps/desktop-host/src-tauri
        run: npx @tauri-apps/cli@2.11.4 build

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $msi = Get-ChildItem "apps/desktop-host/src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          $exe = Get-ChildItem "apps/desktop-host/src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          if (-not $msi -or -not $exe) { throw "Installer output missing." }

      - name: Upload Windows installers
        if: success() && matrix.loop == 5
        uses: actions/upload-artifact@v4
        with:
          name: novin-accounting-windows-${{ github.sha }}
          path: |
            apps/desktop-host/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop-host/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
