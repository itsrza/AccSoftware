#[tauri::command]
fn get_company'''
          s = s.replace(old_tail, new_tail, 1)

          test = textwrap.dedent('''

          #[cfg(test)]
          mod section1_tests {
              use super::*;

              #[test]
              fn connection_enables_required_sqlite_pragmas() {
                  let c = Connection::open_in_memory().expect("open sqlite");
                  configure_connection(&c).expect("configure sqlite");
                  let fk: i64 = c.query_row("PRAGMA foreign_keys", [], |r| r.get(0)).expect("foreign_keys");
                  let journal: String = c.query_row("PRAGMA journal_mode", [], |r| r.get(0)).expect("journal_mode");
                  let sync: i64 = c.query_row("PRAGMA synchronous", [], |r| r.get(0)).expect("synchronous");
                  assert_eq!(fk, 1);
                  assert_eq!(journal.to_ascii_lowercase(), "memory");
                  assert_eq!(sync, 1);
              }

              #[test]
              fn foreign_keys_reject_orphan_rows() {
                  let c = Connection::open_in_memory().expect("open sqlite");
                  configure_connection(&c).expect("configure sqlite");
                  c.execute_batch("CREATE TABLE accounts(id TEXT PRIMARY KEY); CREATE TABLE journal_lines(account_id TEXT REFERENCES accounts(id));")
                      .expect("schema");
                  let result = c.execute("INSERT INTO journal_lines(account_id) VALUES(?1)", rusqlite::params!["missing"]);
                  assert!(result.is_err());
              }
          }
          ''')
          if 'mod section1_tests' not in s:
              s += test
          p.write_text(s, encoding='utf-8')

      - name: Format and test backend
        working-directory: apps/desktop-host/src-tauri
        run: |
          cargo fmt -- --check
          cargo test

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop-host/src-tauri/src/main.rs
          git commit -m "[auto-apply] feat(auth): harden db connections and active user sessions"
          git push origin main
