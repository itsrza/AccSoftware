name: AccSoftware Apply Section 1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch section 1
        shell: python {0}
        run: |
          from pathlib import Path
          import textwrap
          p = Path('apps/desktop-host/src-tauri/src/main.rs')
          s = p.read_text(encoding='utf-8')

          old = textwrap.dedent('''
          fn conn(state: &State<AppState>) -> Result<Connection, String> {
              Connection::open(
                  state
                      .db_path
                      .lock()
                      .map_err(|_| {
                          "APP-001: Ãƒâ„¢Ã¢â‚¬Å¡Ãƒâ„¢Ã‚ÂÃƒâ„¢Ã¢â‚¬Å¾ Ãƒâ„¢Ã‚Â¾ÃƒËœÃ‚Â§Ãƒâ€ºÃ…â€™ÃƒÅ¡Ã‚Â¯ÃƒËœÃ‚Â§Ãƒâ„¢Ã¢â‚¬Â¡ ÃƒËœÃ‚Â¯ÃƒËœÃ‚Â§ÃƒËœÃ‚Â¯Ãƒâ„¢Ã¢â‚¬Â¡ ÃƒËœÃ‚Â¯ÃƒËœÃ‚Â± ÃƒËœÃ‚Â¯ÃƒËœÃ‚Â³ÃƒËœÃ‚ÂªÃƒËœÃ‚Â±ÃƒËœÃ‚Â³ Ãƒâ„¢Ã¢â‚¬Â Ãƒâ€ºÃ…â€™ÃƒËœÃ‚Â³ÃƒËœÃ‚Âª".to_string()
                      })?
                      .clone(),
              )
              .map_err(|e| e.to_string())
          }
          ''').lstrip()
          if old not in s:
              raise SystemExit('conn() exact block not found; aborting without changes')
          new = textwrap.dedent('''
          fn configure_connection(conn: &Connection) -> Result<(), String> {
              conn.pragma_update(None, "foreign_keys", "ON")
                  .map_err(|e| format!("APP-002: failed to enable foreign keys: {e}"))?;
              conn.pragma_update(None, "journal_mode", "WAL")
                  .map_err(|e| format!("APP-003: failed to enable WAL: {e}"))?;
              conn.pragma_update(None, "synchronous", "NORMAL")
                  .map_err(|e| format!("APP-004: failed to set synchronous mode: {e}"))?;
              Ok(())
          }

          fn conn(state: &State<AppState>) -> Result<Connection, String> {
              let db_path = state
                  .db_path
                  .lock()
                  .map_err(|_| "APP-001: database path lock failed".to_string())?
                  .clone();
              let conn = Connection::open(db_path).map_err(|e| e.to_string())?;
              configure_connection(&conn)?;
              Ok(conn)
          }
          ''').lstrip()
          s = s.replace(old, new, 1)

          marker = '        "SELECT id,username,display_name FROM users WHERE id=?1",'
          if marker not in s:
              raise SystemExit('current_user query marker not found; aborting without changes')
          s = s.replace(marker, '        "SELECT id,username,display_name FROM users WHERE id=?1 AND is_active=1",', 1)
          old_tail = '''    )
    .map(Some)
    .map_err(|e| e.to_string())
}

#[tauri::command]
fn get_company'''
          if old_tail not in s:
              raise SystemExit('current_user return block not found; aborting without changes')
          new_tail = '''    ) {
        Ok(user) => Ok(Some(user)),
        Err(rusqlite::Error::QueryReturnedNoRows) => {
            *state.user_id.lock().map_err(|_| "AUTH-001: session lock failed".to_string())? = None;
            Ok(None)
        }
        Err(e) => Err(e.to_string()),
